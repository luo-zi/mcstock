plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 数据生成（本模组暂时不接 GatherDataEvent，留着给以后用）
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // 本模组不依赖任何第三方模组仓库（纯 NeoForge + 原版）。
    // 单测用的 JUnit 从 Maven Central 取；不显式声明的话 Gradle 只会去 NeoForged 的仓库找，
    // 那边没有 junit-jupiter，会直接以连接重置失败。
    mavenCentral()
}

dependencies {
    // 纯逻辑单测：市场引擎、估值、仓位结算、采购定价
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ⚠️ ModDevGradle 把 Minecraft/NeoForge 挂在它自己的 `modDevCompileDependencies` /
// `modDevRuntimeDependencies` 上，**测试源集不会自动继承**，于是「测试里用到 ResourceLocation」
// 会直接编译不过。这里显式继承，测试才能既编得过、也跑得起来。
configurations.testImplementation.extendsFrom(configurations.modDevCompileDependencies)
configurations.testRuntimeOnly.extendsFrom(configurations.modDevRuntimeDependencies)

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// ⚠️ 中文显示名 / 描述写在模板里，所以处理资源时必须按 UTF-8 读，
// 否则「MC 股市」会变成乱码（gradle.properties 里的 mod_name 仍是 ASCII）。
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
